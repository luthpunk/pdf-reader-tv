name: Build Android TV PDF Reader APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --stacktrace
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found, fallback to assembleDebug"
            ./gradlew assembleDebug --stacktrace
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/pdf-reader-tv.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-tv-apk
          path: pdf-reader-tv.apk
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VNAME=$(grep -E "versionName\s*=" app/build.gradle | sed -E "s/.*versionName\s*['\"]([^'\"]+)['\"].*/\1/" || echo "1.0.0")
          TAG_NAME="v${VNAME}-build.${GITHUB_RUN_NUMBER}"

          # Create release notes
          cat << 'EOF' > release_notes.md
          ### 📺 PDF Reader for Android TV
          Clean, distraction-free PDF reader built for your couch and remote control.

          #### ✨ Features in this build:
          - 🎮 **100% Remote D-pad Navigation** — every element reachable with TV remote
          - 📖 **Page-by-Page & Continuous Scroll Modes**
          - 🔍 **Focus Mode** — Hide toolbars on OK button for full-screen reading
          - 📑 **Table of Contents & Bookmarks Side Drawer**
          - 📚 **Library & Continue Reading** with reading progress bar
          - 💾 **Local Storage & USB Drive Browser**
          - 🔗 **Open with...** support from any TV file manager
          EOF

          gh release create "$TAG_NAME" pdf-reader-tv.apk \
            --title "PDF Reader TV ${TAG_NAME}" \
            --notes-file release_notes.md \
            --latest
